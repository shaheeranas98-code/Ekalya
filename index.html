<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ekalya — CA Study Tracker</title>
<meta name="theme-color" content="#1F2A3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231F2A3C'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23F2ECDD' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2ECDD;
    --card:#FBF8F0;
    --card-raised:#FFFDF7;
    --ink:#1F2A3C;
    --ink-soft:#5B6B82;
    --ink-faint:#8993A4;
    --rule:#D6CCAE;
    --rule-strong:#C2B692;
    --brass:#A9793A;
    --brass-dark:#8A6129;
    --red:#A23E32;
    --red-bg:#F4E3DF;
    --amber:#B8862B;
    --amber-bg:#F6ECD8;
    --green:#3E6B52;
    --green-bg:#E3ECE4;
    --shadow: 0 1px 0 rgba(31,42,60,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior-y: none;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}

  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    position:relative;
  }

  /* ---- Header ---- */
  .topbar{
    padding:18px 18px 0 18px;
    position:sticky; top:0; z-index:20;
    background:var(--paper);
  }
  .topbar-row{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  .brand{
    font-family:'Source Serif 4', serif;
    font-weight:700; font-size:21px; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
  }
  .brand-logo{
    height:34px; width:auto; display:block; flex:0 0 auto;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand small{
    display:block; font-family:'IBM Plex Mono', monospace;
    font-size:10px; font-weight:500; color:var(--ink-soft);
    letter-spacing:0.5px; margin-top:1px;
  }
  .level-switch{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--ink); background:var(--card-raised);
    border:1px solid var(--rule-strong); border-radius:2px;
    padding:6px 10px; display:flex; align-items:center; gap:6px;
  }
  .level-switch:active{ background:var(--rule); }

  .tabs-index{
    display:flex; gap:0; margin-top:0; overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs-index::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex:0 0 auto;
    padding:9px 13px 8px 13px;
    font-size:12.5px; font-weight:500; color:var(--ink-soft);
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab-chip.active{ color:var(--ink); border-bottom-color:var(--brass); font-weight:600;}

  /* ---- Content ---- */
  .content{ flex:1; padding:16px 18px 100px 18px; }
  .content.no-pad-top{padding-top:8px;}

  /* ---- Cards / sections ---- */
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card-title{
    font-size:11px; text-transform:none; letter-spacing:0.3px;
    color:var(--ink-soft); font-weight:600; margin:0 0 10px 0;
    display:flex; align-items:center; justify-content:space-between;
  }
  .hr{ border:none; border-top:1px solid var(--rule); margin:12px 0; }

  /* Big stat row */
  .hero-stat{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
  .hero-num{ font-family:'Source Serif 4', serif; font-weight:700; font-size:42px; line-height:1; }
  .hero-label{ color:var(--ink-soft); font-size:12.5px; margin-top:4px;}

  .progress-track{
    height:8px; background:var(--rule); border-radius:4px; overflow:hidden; margin:10px 0 4px 0;
  }
  .progress-fill{ height:100%; background:var(--brass); border-radius:4px; transition:width .35s ease;}
  .progress-fill.green{background:var(--green);}
  .progress-row{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); }

  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat-box{ }
  .stat-box .num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:19px; }
  .stat-box .lbl{ font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .streak-row{ display:flex; align-items:center; gap:10px; }
  .streak-flame{ font-size:22px; }

  /* subject list row */
  .subject-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 2px; border-bottom:1px solid var(--rule);
  }
  .subject-row:last-child{ border-bottom:none; }
  .subject-row .name{ font-weight:500; font-size:14.5px; }
  .subject-row .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .subject-row .pct{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; color:var(--brass-dark); min-width:44px; text-align:right;}
  .subject-mini-bar{ width:100%; height:5px; background:var(--rule); border-radius:3px; margin-top:6px; overflow:hidden;}
  .subject-mini-bar > div{ height:100%; background:var(--brass); }
  .subject-click{ display:flex; flex-direction:column; flex:1; }

  /* revision pill */
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:500; padding:8px 10px; border-radius:3px; margin-bottom:8px; width:100%;
  }
  .pill .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto;}
  .pill.due{ background:var(--red-bg); color:var(--red); }
  .pill.due .dot{ background:var(--red); }
  .pill.week{ background:var(--amber-bg); color:var(--amber); }
  .pill.week .dot{ background:var(--amber); }
  .pill.ok{ background:var(--green-bg); color:var(--green); }
  .pill.ok .dot{ background:var(--green); }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 16px; border-radius:3px; border:1px solid var(--ink);
    background:var(--ink); color:var(--paper); font-weight:600; font-size:14px;
    width:100%;
  }
  .btn:active{ background:var(--ink); opacity:0.85; }
  .btn.secondary{ background:transparent; color:var(--ink); border:1px solid var(--rule-strong); }
  .btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .btn.small{ width:auto; padding:8px 12px; font-size:12.5px; }
  .btn.stop{ background:var(--red); border-color:var(--red); }

  /* Timer */
  .timer-display{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:52px;
    text-align:center; letter-spacing:1px; margin:18px 0 6px 0;
  }
  .timer-context{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:18px; }
  .select-field{
    width:100%; padding:11px 12px; border:1px solid var(--rule-strong); border-radius:3px;
    background:var(--card-raised); font-size:14px; color:var(--ink); margin-bottom:10px;
  }

  /* Chapter table */
  .chapter-tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .chapter-tbl th{
    text-align:center; font-weight:600; color:var(--ink-soft); font-size:10.5px;
    padding:4px 2px; border-bottom:1px solid var(--rule-strong);
  }
  .chapter-tbl th.left, .chapter-tbl td.left{ text-align:left; }
  .chapter-tbl td{ padding:9px 2px; border-bottom:1px solid var(--rule); text-align:center; }
  .chapter-tbl td.left{ font-weight:500; }
  .status-btn{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--rule-strong);
    background:var(--card-raised); font-size:13px; display:inline-flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .status-btn.done{ background:var(--green); border-color:var(--green); color:#fff; }
  .status-btn.inprogress{ background:var(--amber-bg); border-color:var(--amber); color:var(--amber); }
  .status-btn.locked{ opacity:0.3; }
  .qcount{ display:flex; align-items:center; justify-content:center; gap:4px; }
  .qcount button{ width:20px; height:20px; border:1px solid var(--rule-strong); background:var(--card-raised); border-radius:2px; font-size:12px; line-height:1; }
  .qcount .n{ font-family:'IBM Plex Mono',monospace; min-width:22px; text-align:center; }

  /* editable chapter name row */
  .ch-name-input{
    border:none; background:transparent; font:inherit; font-weight:500; width:100%;
    border-bottom:1px dashed transparent; padding:2px 0;
  }
  .ch-name-input:focus{ outline:none; border-bottom-color:var(--rule-strong); }

  /* Tests */
  .test-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--rule); gap:10px;}
  .test-row:last-child{ border-bottom:none; }
  .test-row .name{ font-size:13.5px; font-weight:500; flex:1; }
  .test-inputs{ display:flex; align-items:center; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .test-inputs input{
    width:44px; text-align:center; border:1px solid var(--rule-strong); border-radius:2px;
    padding:5px 2px; font-family:inherit; font-size:13px; background:var(--card-raised);
  }
  .icon-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--rule-strong); background:var(--card-raised);
    display:inline-flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink-soft);
  }

  /* Bottom nav */
  .bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:520px; background:var(--card-raised);
    border-top:1px solid var(--rule-strong);
    display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px 8px 4px; background:none; border:none; color:var(--ink-faint);
  }
  .navbtn .ic{ font-size:19px; line-height:1; }
  .navbtn .lb{ font-size:10px; font-weight:500; }
  .navbtn.active{ color:var(--ink); }
  .navbtn.active .ic{ transform:translateY(-1px); }

  /* Modal / sheet */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(31,42,60,0.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:520px;
    border-radius:14px 14px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)) 18px;
    max-height:82vh; overflow-y:auto;
    border-top:1px solid var(--rule-strong);
  }
  .sheet h3{ margin:0 0 14px 0; }
  .sheet-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:13px 0; border-bottom:1px solid var(--rule);
  }
  .sheet-item:last-of-type{ border-bottom:none; }
  .field-label{ font-size:12px; color:var(--ink-soft); margin-bottom:5px; display:block; }
  .text-input{
    width:100%; padding:11px 12px; border:1px solid var(--rule-strong); border-radius:3px;
    background:var(--card-raised); font-size:14px; color:var(--ink);
  }

  .badge{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 7px; border-radius:2px; background:var(--rule); color:var(--ink-soft); }

  .empty-note{ text-align:center; color:var(--ink-faint); font-size:13px; padding:26px 10px; }

  .add-row{ display:flex; gap:8px; margin-top:10px; }
  .add-row input{ flex:1; }

  ::selection{ background:var(--brass); color:#fff; }

  a{ color:inherit; }

  /* ---- Login / onboarding ---- */
  .auth-screen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom)) 24px;
  }
  .auth-mark{
    width:64px; height:64px; border-radius:14px; background:var(--card-raised);
    border:1px solid var(--rule);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:18px; padding:6px;
  }
  .auth-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .auth-title{ font-size:26px; font-weight:700; margin:0 0 4px 0; }
  .auth-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px 0; line-height:1.5; }
  .field-block{ margin-bottom:20px; }
  .course-grid{ display:flex; flex-direction:column; gap:8px; }
  .course-card{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 15px; border:1.5px solid var(--rule-strong); border-radius:4px;
    background:var(--card-raised);
  }
  .course-card .cname{ font-weight:600; font-size:14.5px; }
  .course-card .cdesc{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .course-card.selected{ border-color:var(--ink); background:var(--card); }
  .course-card .check{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--rule-strong);
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent;
  }
  .course-card.selected .check{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .group-row{ display:flex; gap:8px; margin-top:10px; margin-left:2px; }
  .group-chip{
    flex:1; text-align:center; padding:10px 6px; border:1.5px solid var(--rule-strong); border-radius:4px;
    font-size:13px; font-weight:500; background:var(--card-raised);
  }
  .group-chip.selected{ border-color:var(--brass); background:var(--amber-bg); color:var(--brass-dark); }
  .pin-input{
    width:100%; padding:14px 12px; border:1px solid var(--rule-strong); border-radius:3px;
    background:var(--card-raised); font-size:22px; letter-spacing:10px; text-align:center;
    font-family:'IBM Plex Mono',monospace;
  }
  .auth-error{ color:var(--red); font-size:12.5px; margin-top:8px; text-align:center; }
  .auth-link{ text-align:center; margin-top:16px; font-size:12.5px; color:var(--ink-soft); text-decoration:underline; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================= DEFAULT SYLLABUS DATA ============================= */
// Editable in-app. Chapter names are generic placeholders you can rename to match
// the current ICAI study material (chapter counts are reasonable defaults).
function genChapters(n, prefix){
  const arr=[];
  for(let i=1;i<=n;i++){
    arr.push({ id: uid(), name: (prefix?prefix+" ":"Chapter ")+i, study:"pending", rev:[false,false,false,false], completedDate:null, questions:0, test:false });
  }
  return arr;
}
function defaultTests(){
  return [
    { id: uid(), name:"MCQs", done:0, total:0 },
    { id: uid(), name:"PYQs", done:0, total:0 },
    { id: uid(), name:"MTP", done:0, total:0 },
    { id: uid(), name:"RTP", done:0, total:0 },
    { id: uid(), name:"Mock Tests", done:0, total:0 },
  ];
}
function subj(name, chapterCount){
  return { id: uid(), name, chapters: genChapters(chapterCount), tests: defaultTests() };
}

// Real ICAI chapter-wise breakdown per subject, so subject pages track
// actual named chapters rather than generic "Chapter N" placeholders.
function chaptersFromNames(names){
  return names.map(n => ({ id: uid(), name: n, study:"pending", rev:[false,false,false,false], completedDate:null, questions:0, test:false }));
}
function subjNamed(name, chapterNames){
  return { id: uid(), name, chapters: chaptersFromNames(chapterNames), tests: defaultTests() };
}

  "Security Analysis","Security Valuation","Portfolio Management","Securitization","Mutual Funds",

const CH_FINAL_AUDIT = [
  "Quality Control","General Principles and Auditor Responsibilities","Audit Planning, Strategy and Execution",

// Virtual "combined" levels merge the two groups of a level into one
// tracking/active view. They hold no data of their own — they read live
// off the real interG1/interG2 (or finalG1/finalG2) subjects — so nothing
// needs migrating and edits always land on the correct real group.
const VIRTUAL_MEMBERS = { interBoth: ["interG1","interG2"], finalBoth: ["finalG1","finalG2"] };
// Order used anywhere the person switches/tracks a course (dropdown, Settings lists).
const SWITCHABLE_ORDER = ["foundation","interG1","interG2","interBoth","finalG1","finalG2","finalBoth"];
function memberLevelIds(id){ return VIRTUAL_MEMBERS[id] || [id]; }
// Which course family a switchable id belongs to: "foundation" | "inter" | "final".
function switchableFamily(id){
  if(id==="foundation") return "foundation";
  if(id==="interG1" || id==="interG2" || id==="interBoth") return "inter";
  if(id==="finalG1" || id==="finalG2" || id==="finalBoth") return "final";
  return null;
}
function buildVirtualLevel(id){
  const members = VIRTUAL_MEMBERS[id];
  const first = state.levels[members[0]];
  return {
    label: first.label,
    groupLabel: "Both Groups",
    hasGroups: true,
    virtual: true,
    memberIds: members,
    subjects: members.reduce((arr,mid)=> arr.concat(state.levels[mid].subjects), [])
  };
}
function getLevel(id){ return VIRTUAL_MEMBERS[id] ? buildVirtualLevel(id) : state.levels[id]; }

function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");

  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  const da = new Date(a+"T00:00:00"), db = new Date(b+"T00:00:00");
  return Math.round((db-da)/86400000);

function fmtHM(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.round((totalSeconds%3600)/60);
  if(h<=0) return m+"m";
  return h+"h "+m+"m";
}
function fmtClock(totalSeconds){
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = Math.floor(totalSeconds%60);
  const p = n => String(n).padStart(2,"0");
  return p(h)+":"+p(m)+":"+p(s);
}

const STORE_KEY = "ca-tracker-state";
let state = null;
let saveTimer = null;

// Uses plain localStorage so this file works standalone (hosted, or wrapped
// in an Android WebView). If it happens to be running inside a Claude.ai
// artifact, it will also mirror saves to window.storage — but localStorage
// is the source of truth so the app never depends on that API being present.
async function loadState(){
  try{
    let raw = null;
    try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
    if(!raw && window.storage){
      try{
        const res = await window.storage.get(STORE_KEY, false);
        if(res && res.value) raw = res.value;
      }catch(e){}
    }
    state = raw ? migrateState(JSON.parse(raw)) : defaultState();
  }catch(e){
    state = defaultState();
  }
}
function migrateState(s){
  const d = defaultState();
  const merged = Object.assign(d, s);
  // Upgrade path: data saved before profile/course-select existed.
  // If there's evidence of prior use but no onboarding flag, skip the login
  // screen for this person and enable every level (matches old behavior).
  const hasPriorUse = (s.sessions && s.sessions.length>0) ||
    Object.values(s.levels||{}).some(lv => (lv.subjects||[]).some(sub => (sub.chapters||[]).some(c=>c.study==="done")));
  if(hasPriorUse && !s.onboarded){
    merged.onboarded = true;
    merged.enabledLevels = merged.enabledLevels && merged.enabledLevels.length ? merged.enabledLevels : LEVEL_ORDER.slice();
    merged.profile = merged.profile || {name:"", pin:""};
  }
  if(merged.onboarded && (!merged.enabledLevels || !merged.enabledLevels.length)){
    merged.enabledLevels = [merged.activeLevel];
  }
  // Backfill family for people who onboarded before family-scoping existed —
  // infer it from whatever they already have enabled/active.
  if(merged.onboarded && !merged.family){
    const seed = (merged.enabledLevels && merged.enabledLevels[0]) || merged.activeLevel;
    merged.family = switchableFamily(seed) || "foundation";
  }
  return merged;
}
function queueSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 350);
}
async function doSave(){
  const json = JSON.stringify(state);
  try{ localStorage.setItem(STORE_KEY, json); }catch(e){}
  if(window.storage){
    try{ await window.storage.set(STORE_KEY, json, false); }catch(e){}
  }
}

/* ============================= DERIVED HELPERS ============================= */
function curLevel(){ return getLevel(state.activeLevel); }

function chapterProgress(ch){
  // study weight 0.5, revisions weight 0.5 (split over 4)
  let p = 0;
  if(ch.study==="done") p += 0.5;
  else if(ch.study==="inprogress") p += 0.2;
  const revDone = ch.rev.filter(Boolean).length;
  p += (revDone/4)*0.5;
  return p; // 0..1
}
function subjectStats(subject){
  const total = subject.chapters.length || 1;
  let sum=0, completed=0, rev1=0, rev2=0, rev3=0, rev4=0, questions=0, studySeconds=0, testsTaken=0;
  subject.chapters.forEach(ch=>{
    sum += chapterProgress(ch);
    if(ch.study==="done") completed++;
    if(ch.rev[0]) rev1++;
    if(ch.rev[1]) rev2++;
    if(ch.rev[2]) rev3++;
    if(ch.rev[3]) rev4++;
    questions += (ch.questions||0);
    if(ch.test) testsTaken++;
  });
  studySeconds = sessionsSecondsFor({subjectId:subject.id});
  return {
    pct: Math.round((sum/total)*100),
    total, completed, rev1, rev2, rev3, rev4, questions, studySeconds, testsTaken
  };
}
function levelStats(level){
  let sum=0, total=0, studySeconds=0;
  level.subjects.forEach(s=>{
    total += s.chapters.length;
    s.chapters.forEach(ch=> sum += chapterProgress(ch));
  });
  studySeconds = sessionsSecondsFor({levelId: state.activeLevel});
  return { pct: total? Math.round((sum/total)*100):0, studySeconds };
}
function sessionsSecondsFor(filter){
  const levelIds = filter.levelId ? memberLevelIds(filter.levelId) : null;
  return state.sessions.reduce((acc,s)=>{
    if(levelIds && !levelIds.includes(s.levelId)) return acc;
    if(filter.subjectId && s.subjectId!==filter.subjectId) return acc;
    if(filter.chapterId && s.chapterId!==filter.chapterId) return acc;
    if(filter.date && s.date!==filter.date) return acc;
    if(filter.sinceDate && s.date < filter.sinceDate) return acc;
    return acc + s.seconds;
  },0);
}
function totalSecondsAllTime(){
  return state.sessions.reduce((a,s)=>a+s.seconds,0);
}
function weekStartStr(){
  const d = new Date();
  const day = (d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function studyStreak(){
  const daysWithStudy = new Set(state.sessions.filter(s=>s.seconds>0).map(s=>s.date));
  let streak=0;
  let d = todayStr();
  // if no study logged today yet, streak counts back from yesterday
  if(!daysWithStudy.has(d)){
    d = addDays(d,-1);
  }
  while(daysWithStudy.has(d)){
    streak++;
    d = addDays(d,-1);
  }
  return streak;
}
function allChaptersFlat(){
  const out = [];
  LEVEL_ORDER.forEach(lid=>{
    const lv = state.levels[lid];
    lv.subjects.forEach(s=>{
      s.chapters.forEach(ch=> out.push({levelId:lid, level:lv, subject:s, chapter:ch}));
    });
  });
  return out;
}
function revisionQueue(onlyActiveLevel){
  const items = [];
  const src = onlyActiveLevel
    ? memberLevelIds(state.activeLevel).map(id=>({levelId:id, level:state.levels[id]}))
    : LEVEL_ORDER.map(id=>({levelId:id, level:state.levels[id]}));
  src.forEach(({levelId,level})=>{
    level.subjects.forEach(subject=>{
      subject.chapters.forEach(ch=>{
        if(!ch.completedDate) return;
        ch.rev.forEach((done, idx)=>{
          if(done) return;
          const dueDate = addDays(ch.completedDate, state.revisionOffsets[idx]);
          items.push({ levelId, level, subject, chapter:ch, revIndex:idx, dueDate });
        });
      });
    });
  });
  items.sort((a,b)=> a.dueDate < b.dueDate ? -1 : 1);
  return items;
}

    <h1 class="auth-title serif">Set up Ekalya</h1>
    <p class="auth-sub">A few quick details so your dashboard shows the right course. Everything stays on this device.</p>

    <div class="field-block">
      <label class="field-label">Your name</label>
      <input class="text-input" id="onboard-name" placeholder="e.g. Aditi" value="${escapeHtml(d.name)}">
    </div>

    <div class="field-block">
      <label class="field-label">Which course are you preparing for?</label>
      <div class="course-grid">
        ${(d.family ? familyCards.filter(f=>f.id===d.family) : familyCards).map(f=>`
          <div class="course-card ${d.family===f.id?'selected':''}" data-act="select-family" data-family="${f.id}">
            <div><div class="cname">${f.name}</div><div class="cdesc">${f.desc}</div></div>
            <div class="check">✓</div>
          </div>
        `).join("")}
      </div>
      ${d.family ? `<div class="auth-link" data-act="change-family" style="margin-top:6px;">Change course</div>` : ""}
      ${showGroups ? `
        <div class="group-row">
          <div class="group-chip ${d.groups[d.family].g1 && !d.groups[d.family].g2?'selected':''}" data-act="toggle-group" data-family="${d.family}" data-group="g1">Group 1</div>

/* ----- Bottom nav ----- */
function renderBottomNav(){
  const items = [
    ["home","⌂","Home"],
    ["subjects","▤","Subjects"],
    ["timer","◷","Timer"],
    ["revisions","↻","Revise"],
    ["settings","⚙","More"],
  ];
  return `<div class="bottomnav">
    ${items.map(([id,ic,lb])=>`
      <button class="navbtn ${ui.tab===id?'active':''}" data-act="tab" data-tab="${id}">
        <div class="ic">${ic}</div><div class="lb">${lb}</div>
      </button>`).join("")}
  </div>`;
}

/* ----- Content router ----- */
function renderContent(){
  let inner = "";
  if(ui.tab==="home") inner = renderHome();
  else if(ui.tab==="subjects") inner = ui.subjectId ? renderSubjectDetail() : renderSubjects();
  else if(ui.tab==="timer") inner = renderTimer();
  else if(ui.tab==="revisions") inner = renderRevisions();
  else if(ui.tab==="tests") inner = renderTests();
  else if(ui.tab==="settings") inner = renderSettings();
  return `<div class="content">${inner}</div>`;
}

/* ============================= HOME ============================= */
function renderHome(){
  const lv = curLevel();
  const ls = levelStats(lv);
  const streak = studyStreak();
  const weekSec = sessionsSecondsFor({levelId: state.activeLevel, sinceDate: weekStartStr()});
  const todaySec = sessionsSecondsFor({levelId: state.activeLevel, date: todayStr()});
  const targetSec = state.dailyTargetHours*3600;
  const dueQ = revisionQueue(true);
  const dueToday = dueQ.filter(i=>i.dueDate<=todayStr());
  const dueWeek = dueQ.filter(i=>i.dueDate>todayStr() && daysBetween(todayStr(), i.dueDate)<=7);
  const pendingChapters = lv.subjects.reduce((a,s)=> a + s.chapters.filter(c=>c.study!=="done").length, 0);
  const examInfo = lv.virtual ? combinedExamInfo(state.activeLevel) : (state.examDates[state.activeLevel] ? {date:state.examDates[state.activeLevel]} : null);

  let examBlock = "";
  if(examInfo){
    const days = daysBetween(todayStr(), examInfo.date);
    const remainingChapters = pendingChapters;
    const dailyNeed = days>0 ? (remainingChapters/days) : 0;
    const subDates = lv.virtual ? `
      <div class="hr"></div>
      ${lv.memberIds.map(mid=>`<div class="progress-row"><span>${escapeHtml(levelTitle(state.levels[mid]))}</span><span class="mono">${state.examDates[mid]?escapeHtml(state.examDates[mid]):'not set'}</span></div>`).join("")}
    ` : "";
    examBlock = `
    <div class="card">
      <div class="card-title">EXAM COUNTDOWN — ${escapeHtml(levelTitle(lv))}</div>
      <div class="hero-stat">
        <div>
          <div class="hero-num mono">${days>=0?days:0}</div>
          <div class="hero-label">days left · ${escapeHtml(examInfo.date)}${lv.virtual?' (nearest)':''}</div>
        </div>
        <div style="text-align:right;">
          <div class="hero-num mono" style="font-size:26px;">${dailyNeed>0?dailyNeed.toFixed(1):"0.0"}</div>
          <div class="hero-label">chapters / day needed</div>
        </div>
      </div>
      ${subDates}
    </div>`;
  } else {
    examBlock = `
    <div class="card">
      <div class="card-title">EXAM COUNTDOWN</div>
      <div class="empty-note" style="padding:8px 0 2px 0;">No exam date set for ${escapeHtml(levelTitle(lv))}.</div>
      ${lv.virtual
        ? `<div class="empty-note" style="padding-top:0;">Set each group's exam date in Settings.</div>`
        : `<button class="btn secondary small" data-act="set-exam-date">Set exam date</button>`}
    </div>`;
  }

  return `
    <div style="font-size:13px; color:var(--ink-soft); margin-bottom:10px;">Welcome back, ${escapeHtml(state.profile.name||'')}</div>
    <div class="card">
      <div class="card-title">OVERALL PROGRESS — ${escapeHtml(levelTitle(lv))}</div>
      <div class="hero-stat">
        <div>
          <div class="hero-num mono">${ls.pct}%</div>
          <div class="hero-label">syllabus covered</div>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${ls.pct}%"></div></div>
      <div class="hr"></div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="num">${fmtHM(weekSec)}</div>
          <div class="lbl">This week</div>
        </div>
        <div class="stat-box">
          <div class="num">${fmtHM(sessionsSecondsFor({levelId:state.activeLevel}))}</div>
          <div class="lbl">Total (this level)</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">TODAY</div>
      <div class="streak-row" style="margin-bottom:10px;">
        <div class="streak-flame">🔥</div>
        <div><div style="font-weight:600; font-size:14px;">${streak}-day streak</div>
        <div style="font-size:11.5px; color:var(--ink-soft);">Study any amount today to keep it going</div></div>
      </div>
      ${dueToday.length ? `<div class="pill due"><span class="dot"></span>${dueToday.length} revision${dueToday.length>1?'s':''} due today</div>`:""}
      ${dueWeek.length ? `<div class="pill week"><span class="dot"></span>${dueWeek.length} due this week</div>`:""}
      ${pendingChapters>0 ? `<div class="pill ok"><span class="dot"></span>${pendingChapters} chapter${pendingChapters>1?'s':''} still pending</div>`:""}
      <div class="progress-row" style="margin-top:10px;">
        <span>Today's target: ${state.dailyTargetHours}h</span>
        <span class="mono">${fmtHM(todaySec)} / ${fmtHM(targetSec)}</span>
      </div>
      <div class="progress-track"><div class="progress-fill green" style="width:${Math.min(100, Math.round(todaySec/targetSec*100)||0)}%"></div></div>
      <button class="btn" style="margin-top:14px;" data-act="tab" data-tab="timer">Start study</button>
    </div>

    ${examBlock}

    <div class="card">
      <div class="card-title">SUBJECTS <span class="badge">${escapeHtml(levelTitle(lv))}</span></div>
      ${lv.subjects.map(s=>{
        const st = subjectStats(s);
        return `<div class="subject-row">
          <div class="subject-click" data-act="open-subject" data-id="${s.id}">
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="sub">${st.completed}/${st.total} chapters done · ${fmtHM(st.studySeconds)}</div>
            <div class="subject-mini-bar"><div style="width:${st.pct}%"></div></div>
          </div>
          <div class="pct">${st.pct}%</div>
        </div>`;
      }).join("") || `<div class="empty-note">No subjects yet — add some in Settings.</div>`}
    </div>
  `;
}

/* ============================= SUBJECTS LIST ============================= */
function renderSubjects(){
  const lv = curLevel();
  return `
    <div class="card">
      <div class="card-title">SUBJECTS — ${escapeHtml(levelTitle(lv))}</div>
      ${lv.subjects.map(s=>{
        const st = subjectStats(s);
        return `<div class="subject-row">
          <div class="subject-click" data-act="open-subject" data-id="${s.id}">
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="sub">Ch: ${st.total} · Done: ${st.completed} · Rev1: ${st.rev1}/${st.total} · Rev2: ${st.rev2}/${st.total}</div>
            <div class="sub">Questions: ${st.questions} · Study: ${fmtHM(st.studySeconds)}</div>
            <div class="subject-mini-bar"><div style="width:${st.pct}%"></div></div>
          </div>
          <div class="pct">${st.pct}%</div>
        </div>`;
      }).join("") || `<div class="empty-note">No subjects yet. Go to More → Edit syllabus to add some.</div>`}
    </div>
    <button class="btn secondary small" data-act="tab" data-tab="settings">Edit syllabus structure →</button>
  `;
}

/* ============================= SUBJECT DETAIL ============================= */
function findSubject(id){
  for(const lid of LEVEL_ORDER){
    const s = state.levels[lid].subjects.find(x=>x.id===id);
    if(s) return {subject:s, levelId:lid};
  }
  return null;
}

    const canRev = i => ch.completedDate && (i===0 || ch.rev[i-1]);

function renderTestRows(subject){
  return subject.tests.map(t=>`
    <div class="test-row">
      <div class="name">${escapeHtml(t.name)}</div>
      <div class="test-inputs">
        <input type="number" inputmode="numeric" min="0" value="${t.done}" data-act="test-done" data-subject="${subject.id}" data-test="${t.id}">

/* ============================= TIMER ============================= */
function renderTimer(){
  const running = !!state.timer;
  let subjOptions = "", chapterOptions = "";
  // Only show subjects from the course/group currently selected up top —
  // a combined "Both Groups" view still spans its two real groups, so the
  // group name stays as a prefix there to tell subjects apart.
  const timerLevelIds = memberLevelIds(state.activeLevel);
  timerLevelIds.forEach(lid=>{
    const lv = state.levels[lid];
    lv.subjects.forEach(s=>{
      const label = timerLevelIds.length>1 ? `${escapeHtml(lv.groupLabel)} · ${escapeHtml(s.name)}` : escapeHtml(s.name);
      subjOptions += `<option value="${lid}::${s.id}" ${running && state.timer.subjectId===s.id ? 'selected':''}>${label}</option>`;
    });
  });

  let chapterSelectHtml = "";
  let activeSubject = null, activeLevelId = state.activeLevel;
  if(running){
    activeLevelId = state.timer.levelId;
    activeSubject = state.levels[state.timer.levelId].subjects.find(s=>s.id===state.timer.subjectId);
  } else if(ui.timerSubjectSel){
    const [lid, sid] = ui.timerSubjectSel.split("::");
    activeLevelId = lid;
    activeSubject = state.levels[lid].subjects.find(s=>s.id===sid);
  } else {
    const lv = curLevel();
    if(lv.subjects[0]){ activeSubject = lv.subjects[0]; activeLevelId = state.activeLevel; }
  }
  if(activeSubject){
    chapterOptions = activeSubject.chapters.map(c=>`<option value="${c.id}" ${running && state.timer.chapterId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join("");
  }

  let elapsed = 0;
  if(running){
    elapsed = Math.floor((Date.now() - state.timer.startedAt)/1000);
  }

  const todaySec = sessionsSecondsFor({date: todayStr()});
  const weekSec = sessionsSecondsFor({sinceDate: weekStartStr()});
  const totalSec = totalSecondsAllTime();

  return `
    <div class="card">
      <div class="card-title">STUDY TIMER</div>
      ${!running ? `
        <label class="field-label">Subject</label>
        <select class="select-field" id="timer-subject">
          ${subjOptions || '<option>No subjects — add one first</option>'}
        </select>
        <label class="field-label">Chapter</label>
        <select class="select-field" id="timer-chapter">
          ${chapterOptions || '<option>—</option>'}
        </select>
        <div class="timer-display mono">00:00:00</div>
        <button class="btn" data-act="start-timer">▶ Start study</button>
      ` : `
        <div class="timer-context">${escapeHtml(levelTitle(state.levels[activeLevelId]))} · ${escapeHtml(activeSubject?activeSubject.name:"")}${state.timer.chapterId && activeSubject ? " — " + escapeHtml((activeSubject.chapters.find(c=>c.id===state.timer.chapterId)||{}).name||"") : ""}</div>
        <div class="timer-display mono" id="timer-live">${fmtClock(elapsed)}</div>
        <button class="btn stop" data-act="stop-timer">■ Stop & save</button>
      `}
    </div>
    <div class="card">
      <div class="card-title">SESSION LOG</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${fmtHM(todaySec)}</div><div class="lbl">Today's study</div></div>
        <div class="stat-box"><div class="num">${fmtHM(weekSec)}</div><div class="lbl">This week</div></div>
      </div>
      <div class="hr"></div>
      <div class="stat-box"><div class="num">${fmtHM(totalSec)}</div><div class="lbl">Total, all levels</div></div>
    </div>
  `;
}

/* ============================= REVISIONS ============================= */
function renderRevisions(){
  const q = revisionQueue(false);
  const today = todayStr();
  const overdueOrToday = q.filter(i=>i.dueDate<=today);
  const thisWeek = q.filter(i=>i.dueDate>today && daysBetween(today,i.dueDate)<=7);
  const later = q.filter(i=>i.dueDate>today && daysBetween(today,i.dueDate)>7);

  function group(list, tone){
    if(!list.length) return `<div class="empty-note">Nothing here.</div>`;
    return list.map(item=>`
      <div class="test-row">
        <div style="flex:1;">
          <div class="name">${escapeHtml(item.chapter.name)}</div>
          <div style="font-size:11px; color:var(--ink-soft); margin-top:2px;">${escapeHtml(item.subject.name)} · Rev ${item.revIndex+1} · due ${item.dueDate}</div>
        </div>
        <button class="btn small ${tone==='due'?'':'secondary'}" data-act="mark-revision" data-subject="${item.subject.id}" data-chapter="${item.chapter.id}" data-idx="${item.revIndex}">Mark done</button>
      </div>
    `).join("");
  }

  return `
    <div class="card">
      <div class="card-title">REVISION SCHEDULE <span class="badge">${state.revisionOffsets.join("d / ")}d</span></div>
      <div style="font-size:12px; color:var(--ink-soft);">Completing a chapter auto-schedules 4 revisions at day +${state.revisionOffsets.join(", +")}.</div>
    </div>
    <div class="card">
      <div class="card-title">🔴 DUE NOW <span class="badge">${overdueOrToday.length}</span></div>
      ${group(overdueOrToday,'due')}
    </div>
    <div class="card">
      <div class="card-title">🟡 DUE THIS WEEK <span class="badge">${thisWeek.length}</span></div>
      ${group(thisWeek,'week')}
    </div>
    <div class="card">
      <div class="card-title">LATER <span class="badge">${later.length}</span></div>
      ${group(later.slice(0,10),'later')}
      ${later.length>10?`<div class="empty-note">+ ${later.length-10} more</div>`:""}
    </div>
  `;
}

/* ============================= EVENT BINDING ============================= */
function bindEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll('[data-act]').forEach(el=>{
    const act = el.getAttribute('data-act');

    if(act==="tab"){
      el.addEventListener('click', ()=>{
        ui.tab = el.getAttribute('data-tab');
        if(ui.tab!=="subjects") ui.subjectId=null;
        render();
      });
    }
    else if(act==="open-subject"){
      el.addEventListener('click', ()=>{
        ui.subjectId = el.getAttribute('data-id');
        ui.tab = "subjects";
        render();
      });
    }
    else if(act==="back-to-subjects"){
      el.addEventListener('click', ()=>{ ui.subjectId=null; render(); });
    }
    else if(act==="open-level-switch"){
      el.addEventListener('click', ()=>{ ui.sheet={type:"level-switch"}; render(); });
    }
    else if(act==="set-exam-date"){
      el.addEventListener('click', ()=>{ ui.sheet={type:"exam-date"}; render(); });
    }
    else if(act==="close-sheet"){
      el.addEventListener('click', (e)=>{ if(e.target===el){ ui.sheet=null; render(); } });
    }
    else if(act==="stop"){
      el.addEventListener('click', (e)=> e.stopPropagation());
    }
    else if(act==="switch-level"){
      el.addEventListener('click', ()=>{
        state.activeLevel = el.getAttribute('data-level');
        ui.sheet=null; ui.subjectId=null; ui.timerSubjectSel=null;
        queueSave(); render();
      });
    }
    else if(act==="save-exam-date"){
      el.addEventListener('click', ()=>{
        if(VIRTUAL_MEMBERS[state.activeLevel]) { ui.sheet=null; render(); return; } // combined view — set per-group dates in Settings
        const v = document.getElementById('sheet-exam-date').value;
        state.examDates[state.activeLevel] = v;
        ui.sheet=null; queueSave(); render();
      });
    }
    else if(act==="cycle-study"){
      el.addEventListener('click', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        if(!ch) return;
        const order = ["pending","inprogress","done"];
        const next = order[(order.indexOf(ch.study)+1)%order.length];
        const wasDone = ch.study==="done";
        ch.study = next;
        if(next==="done" && !wasDone){
          ch.completedDate = todayStr();
        }
        if(next!=="done"){
          ch.completedDate = null;
          ch.rev=[false,false,false,false];
        }
        queueSave(); render();
      });
    }
    else if(act==="toggle-rev"){
      el.addEventListener('click', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        const idx = Number(el.getAttribute('data-idx'));
        if(!ch) return;
        ch.rev[idx] = !ch.rev[idx];
        queueSave(); render();
      });
    }
    else if(act==="mark-revision"){
      el.addEventListener('click', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        const idx = Number(el.getAttribute('data-idx'));
        if(!ch) return;
        ch.rev[idx] = true;
        queueSave(); render();
      });
    }
    else if(act==="toggle-test"){
      el.addEventListener('click', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        if(!ch) return;
        ch.test = !ch.test;
        queueSave(); render();
      });
    }
    else if(act==="q-inc" || act==="q-dec"){
      el.addEventListener('click', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        if(!ch) return;
        ch.questions = Math.max(0, (ch.questions||0) + (act==="q-inc"?1:-1));
        queueSave(); render();
      });
    }
    else if(act==="rename-chapter"){
      el.addEventListener('change', ()=>{
        const ch = findChapter(el.getAttribute('data-subject'), el.getAttribute('data-chapter'));
        if(!ch) return;
        ch.name = el.value.trim() || ch.name;
        queueSave();
      });
    }
    else if(act==="add-chapter"){
      el.addEventListener('click', ()=>{
        const input = document.getElementById('new-chapter-name');
        const name = input.value.trim();
        if(!name) return;
        const subject = findSubjectById(el.getAttribute('data-subject'));
        if(!subject) return;
        subject.chapters.push({ id:uid(), name, study:"pending", rev:[false,false,false,false], completedDate:null, questions:0, test:false });
        queueSave(); render();
      });
    }
    else if(act==="rename-subject"){
      el.addEventListener('change', ()=>{
        const s = findSubjectById(el.getAttribute('data-subject'));
        if(!s) return;
        s.name = el.value.trim() || s.name;
        queueSave();
      });
    }
    else if(act==="del-subject"){
      el.addEventListener('click', ()=>{
        if(!confirm('Delete this subject and all its data?')) return;
        const subjectId = el.getAttribute('data-subject');
        const found = findSubject(subjectId); // always resolves to the real, physical level
        if(!found) return;
        const realLv = state.levels[found.levelId];
        realLv.subjects = realLv.subjects.filter(s=>s.id!==subjectId);
        queueSave(); render();
      });
    }
    else if(act==="add-subject"){
      el.addEventListener('click', ()=>{
        const lv = curLevel();
        if(lv.virtual) return; // combined view — add subjects from a specific group instead
        const input = document.getElementById('new-subject-name');
        const name = input.value.trim();
        if(!name) return;
        lv.subjects.push(subj(name, 10));
        queueSave(); render();
      });
    }
    else if(act==="add-test"){
      el.addEventListener('click', ()=>{
        const input = document.getElementById('new-test-name');
        const name = input.value.trim();
        if(!name) return;
        const s = findSubjectById(el.getAttribute('data-subject'));
        if(!s) return;
        s.tests.push({id:uid(), name, done:0, total:0});
        queueSave(); render();
      });
    }
    else if(act==="del-test"){
      el.addEventListener('click', ()=>{
        const s = findSubjectById(el.getAttribute('data-subject'));
        if(!s) return;
        s.tests = s.tests.filter(t=>t.id!==el.getAttribute('data-test'));
        queueSave(); render();
      });
    }
    else if(act==="test-done" || act==="test-total"){
      el.addEventListener('change', ()=>{
        const s = findSubjectById(el.getAttribute('data-subject'));
        if(!s) return;
        const t = s.tests.find(x=>x.id===el.getAttribute('data-test'));
        if(!t) return;
        const v = Math.max(0, Number(el.value)||0);
        if(act==="test-done") t.done=v; else t.total=v;
        queueSave();
      });
    }
    else if(act==="save-target"){
      el.addEventListener('click', ()=>{
        const v = Number(document.getElementById('daily-target-input').value)||0;
        state.dailyTargetHours = v;
        queueSave(); render();
      });
    }
    else if(act==="save-profile-name"){
      el.addEventListener('click', ()=>{
        const v = document.getElementById('profile-name-input').value.trim();
        if(!v) return;
        state.profile.name = v;
        queueSave(); render();
      });
    }
    else if(act==="save-profile-pin"){
      el.addEventListener('click', ()=>{
        const v = document.getElementById('profile-pin-input').value.replace(/\D/g,"").slice(0,4);
        if(!/^\d{4}$/.test(v)){ alert('PIN must be exactly 4 digits.'); return; }
        state.profile.pin = v;
        queueSave(); render();
      });
    }
    else if(act==="remove-pin"){
      el.addEventListener('click', ()=>{
        state.profile.pin = "";
        queueSave(); render();
      });
    }
    else if(act==="lock-now"){
      el.addEventListener('click', ()=>{
        ui.locked = true;
        render();
      });
    }
    else if(act==="toggle-enabled-level"){
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-level');
        const on = state.enabledLevels.includes(id);
        if(on){
          if(state.enabledLevels.length<=1){ alert('At least one course needs to stay on.'); return; }
          state.enabledLevels = state.enabledLevels.filter(x=>x!==id);
          if(state.activeLevel===id) state.activeLevel = state.enabledLevels[0];
        } else {
          state.enabledLevels.push(id);
        }
        queueSave(); render();
      });
    }
    else if(act==="goto-manage-courses"){
      el.addEventListener('click', ()=>{
        ui.sheet = null; ui.tab = "settings"; ui.subjectId=null;
        render();
      });
    }
    else if(act==="set-exam"){
      el.addEventListener('change', ()=>{
        state.examDates[el.getAttribute('data-level')] = el.value;
        queueSave(); render();
      });
    }
    else if(act==="rev-offset"){
      el.addEventListener('change', ()=>{
        const idx = Number(el.getAttribute('data-idx'));
        state.revisionOffsets[idx] = Math.max(1, Number(el.value)||1);
        queueSave(); render();
      });
    }
    else if(act==="export-data"){
      el.addEventListener('click', async ()=>{
        const json = JSON.stringify(state, null, 2);
        try{
          await navigator.clipboard.writeText(json);
          alert('Backup copied to clipboard. Paste it somewhere safe.');
        }catch(e){
          prompt('Copy this backup text:', json);
        }
      });
    }
    else if(act==="reset-data"){
      el.addEventListener('click', ()=>{
        if(!confirm('This deletes all progress on this device. Continue?')) return;
        state = defaultState();
        queueSave(); render();
      });
    }
    else if(act==="start-timer"){
      el.addEventListener('click', ()=>{
        const subjSel = document.getElementById('timer-subject');
        const chSel = document.getElementById('timer-chapter');
        if(!subjSel || !subjSel.value || !subjSel.value.includes("::")){ alert('Add a subject first.'); return; }
        const [levelId, subjectId] = subjSel.value.split("::");
        const chapterId = chSel && chSel.value !== "—" ? chSel.value : null;
        state.timer = { startedAt: Date.now(), levelId, subjectId, chapterId };
        queueSave(); render(); startTicking();
      });
    }
    else if(act==="stop-timer"){
      el.addEventListener('click', ()=>{
        if(!state.timer) return;
        const seconds = Math.floor((Date.now()-state.timer.startedAt)/1000);
        if(seconds>=5){
          state.sessions.push({ date: todayStr(), levelId: state.timer.levelId, subjectId: state.timer.subjectId, chapterId: state.timer.chapterId, seconds });
        }
        state.timer = null;
        stopTicking();
        queueSave(); render();
      });
    }
  });

  // subject/chapter select change on timer (re-render chapter list)
  const timerSubjSel = document.getElementById('timer-subject');
  if(timerSubjSel){
    timerSubjSel.addEventListener('change', ()=>{
      ui.timerSubjectSel = timerSubjSel.value;
      render();
    });
  }

  if(state.timer){ startTicking(); } else { stopTicking(); }
}

function familyToLevels(family, groups){
  if(family==="foundation") return ["foundation"];
  if(family==="inter"){
    const out=[]; if(groups.inter.g1) out.push("interG1"); if(groups.inter.g2) out.push("interG2");
    if(groups.inter.g1 && groups.inter.g2) out.push("interBoth");
    return out;
  }
  if(family==="final"){
    const out=[]; if(groups.final.g1) out.push("finalG1"); if(groups.final.g2) out.push("finalG2");
    if(groups.final.g1 && groups.final.g2) out.push("finalBoth");
    return out;
  }
  return [];
}

function bindLoginEvents(){
  const app = document.getElementById("app");
  const nameInput = document.getElementById("onboard-name");
  if(nameInput) nameInput.addEventListener("input", ()=>{ ui.onboard.name = nameInput.value; });
  const pinInput = document.getElementById("onboard-pin");
  if(pinInput) pinInput.addEventListener("input", ()=>{
    ui.onboard.pin = pinInput.value.replace(/\D/g,"").slice(0,4);
    pinInput.value = ui.onboard.pin;
  });

  app.querySelectorAll('[data-act="select-family"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      ui.onboard.name = document.getElementById("onboard-name") ? document.getElementById("onboard-name").value : ui.onboard.name;
      ui.onboard.pin = document.getElementById("onboard-pin") ? document.getElementById("onboard-pin").value : ui.onboard.pin;
      ui.onboard.family = el.getAttribute("data-family");
      ui.onboard.error = "";
      render();
    });
  });
  app.querySelectorAll('[data-act="toggle-group"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      ui.onboard.name = document.getElementById("onboard-name") ? document.getElementById("onboard-name").value : ui.onboard.name;
      ui.onboard.pin = document.getElementById("onboard-pin") ? document.getElementById("onboard-pin").value : ui.onboard.pin;
      const fam = el.getAttribute("data-family"), grp = el.getAttribute("data-group");
      if(grp==="both"){
        const bothOn = ui.onboard.groups[fam].g1 && ui.onboard.groups[fam].g2;
        ui.onboard.groups[fam].g1 = !bothOn;
        ui.onboard.groups[fam].g2 = !bothOn;
      } else {
        ui.onboard.groups[fam][grp] = !ui.onboard.groups[fam][grp];
      }
      ui.onboard.error = "";
      render();
    });
  });
  app.querySelectorAll('[data-act="change-family"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      ui.onboard.name = document.getElementById("onboard-name") ? document.getElementById("onboard-name").value : ui.onboard.name;
      ui.onboard.pin = document.getElementById("onboard-pin") ? document.getElementById("onboard-pin").value : ui.onboard.pin;
      ui.onboard.family = null;
      ui.onboard.error = "";
      render();
    });
  });
  const continueBtn = app.querySelector('[data-act="complete-onboarding"]');
  if(continueBtn){
    continueBtn.addEventListener("click", ()=>{
      const d = ui.onboard;
      d.name = nameInput ? nameInput.value : d.name;
      d.pin = pinInput ? pinInput.value.replace(/\D/g,"").slice(0,4) : d.pin;
      if(!d.name.trim()){ d.error = "Enter your name to continue."; render(); return; }
      if(!d.family){ d.error = "Pick a course to continue."; render(); return; }
      const showGroups = d.family==="inter" || d.family==="final";
      if(showGroups && !d.groups[d.family].g1 && !d.groups[d.family].g2){ d.error = "Select at least one group."; render(); return; }
      if(d.pin!=="" && !/^\d{4}$/.test(d.pin)){ d.error = "PIN must be exactly 4 digits, or left blank."; render(); return; }

      const enabled = familyToLevels(d.family, d.groups);
      state.profile = { name: d.name.trim(), pin: d.pin };
      state.family = d.family;
      state.enabledLevels = enabled;
      // If both groups were picked, default the active view to the combined "Both Groups" one.
      const bothId = enabled.find(id=>VIRTUAL_MEMBERS[id]);
      state.activeLevel = bothId || enabled[0];
      state.onboarded = true;
      ui.locked = false;
      ui.tab = "home";
      queueSave(); render();
    });
  }
}

function bindUnlockEvents(){
  const app = document.getElementById("app");
  const pinInput = document.getElementById("unlock-pin-input");
  if(pinInput){
    pinInput.addEventListener("input", ()=>{
      ui.unlockPin = pinInput.value.replace(/\D/g,"").slice(0,4);
      pinInput.value = ui.unlockPin;
    });
    pinInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") attemptUnlock(); });
  }
  const btn = app.querySelector('[data-act="attempt-unlock"]');
  if(btn) btn.addEventListener("click", attemptUnlock);
  const forgot = app.querySelector('[data-act="forgot-pin"]');
  if(forgot) forgot.addEventListener("click", ()=>{
    if(!confirm("This resets Ekalya completely and deletes all study data on this device. Continue?")) return;
    state = defaultState();
    ui.locked = false; ui.unlockPin=""; ui.unlockError="";
    queueSave(); render();
  });
}
function attemptUnlock(){
  if(ui.unlockPin === state.profile.pin){
    ui.locked = false; ui.unlockPin=""; ui.unlockError="";
    render();
  } else {
    ui.unlockError = "Incorrect PIN.";
    ui.unlockPin = "";
    render();
  }
}

function findSubjectById(id){
  for(const lid of LEVEL_ORDER){
    const s = state.levels[lid].subjects.find(x=>x.id===id);
    if(s) return s;
  }
  return null;
}
function findChapter(subjectId, chapterId){
  const s = findSubjectById(subjectId);
  if(!s) return null;
  return s.chapters.find(c=>c.id===chapterId) || null;
}

function startTicking(){
  stopTicking();
  tickInterval = setInterval(()=>{
    const el = document.getElementById('timer-live');
    if(el && state.timer){
      el.textContent = fmtClock(Math.floor((Date.now()-state.timer.startedAt)/1000));
    }
  }, 1000);
}
function stopTicking(){
  if(tickInterval){ clearInterval(tickInterval); tickInterval=null; }
}

/* ============================= BOOT ============================= */
async function boot(){
  document.getElementById("app").innerHTML = `<div style="padding:40px 20px; text-align:center; color:#5B6B82; font-family:'IBM Plex Sans',sans-serif;">Loading your ledger…</div>`;
  await loadState();
  ui.locked = !!(state.onboarded && state.profile && state.profile.pin);
  render();
}
boot();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

})();
